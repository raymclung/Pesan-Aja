<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1F4FD9" />
<title>Edit Profil — PesanAja</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --c-primary:#1F4FD9;--c-primary-600:#1A45BF;--c-primary-700:#153BA6;
  --c-accent:#FF7A2D;--c-accent-600:#ED6A1C;
  --c-ink:#0B1726;--c-ink-2:#1B2738;--c-muted:#5B6B7E;--c-muted-2:#8492A6;
  --c-line:#E6EAF0;--c-line-2:#EEF2F7;--c-bg-alt:#F6F8FC;--c-bg-soft:#EEF3FF;
  --c-ok:#16A34A;--c-danger:#EF4444;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:var(--font);color:var(--c-ink);background:#EEF2F7}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(11,23,38,.08)}

/* Header */
.page-header{
  display:flex;align-items:center;gap:12px;padding:16px 20px;
  background:#fff;border-bottom:1px solid var(--c-line-2);position:sticky;top:0;z-index:10;
}
.page-header button{width:36px;height:36px;border-radius:50%;background:var(--c-bg-alt);
  display:flex;align-items:center;justify-content:center}
.page-header svg{width:18px;height:18px;stroke:var(--c-ink);fill:none;stroke-width:2.4}
.page-header h1{margin:0;font-size:18px;font-weight:800;flex:1}

/* Avatar editor */
.avatar-edit{padding:24px 20px;text-align:center;background:linear-gradient(180deg,var(--c-bg-soft) 0%,#fff 100%)}
.avatar-wrap{position:relative;display:inline-block}
.avatar-big{
  width:96px;height:96px;border-radius:50%;
  background:linear-gradient(135deg,var(--c-primary),var(--c-primary-700));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;border:4px solid #fff;box-shadow:0 8px 22px rgba(31,79,217,.25);
}
.avatar-cam{
  position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:50%;
  background:var(--c-accent);color:#fff;display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;cursor:pointer;
}
.avatar-cam svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4}
.avatar-edit p{margin:14px 0 0;color:var(--c-muted);font-size:12.5px;cursor:pointer}
.avatar-edit p strong{color:var(--c-primary);font-weight:700}

/* Form */
.form-section{padding:20px;display:flex;flex-direction:column;gap:18px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group label{font-size:12.5px;font-weight:700;color:var(--c-ink-2)}
.form-group .field{
  position:relative;display:flex;align-items:center;
  background:#fff;border:1.5px solid var(--c-line);border-radius:12px;
  transition:border-color .15s,box-shadow .15s;
}
.form-group .field:focus-within{border-color:var(--c-primary);box-shadow:0 0 0 4px rgba(31,79,217,.1)}
.form-group .field svg.ic{width:18px;height:18px;stroke:var(--c-muted-2);fill:none;stroke-width:2;margin:0 14px;flex-shrink:0}
.form-group input,.form-group select,.form-group textarea{
  flex:1;padding:12px 14px 12px 0;border:none;outline:none;background:transparent;
  font-family:inherit;font-size:14px;color:var(--c-ink);width:100%;min-width:0;
}
.form-group textarea{padding:12px 14px;min-height:80px;resize:vertical;font-family:inherit}
.form-group .hint{font-size:11.5px;color:var(--c-muted);margin-top:-2px}

.section-divider{
  padding:16px 20px 6px;font-size:11px;color:var(--c-muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:700;
}

/* Buttons */
.actions-bottom{
  position:sticky;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:1px solid var(--c-line);display:flex;gap:10px;
  box-shadow:0 -4px 16px rgba(11,23,38,.06);
}
.btn-save{
  flex:1;padding:14px 0;background:var(--c-primary);color:#fff;border-radius:12px;
  font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(31,79,217,.3);
}
.btn-save:hover{background:var(--c-primary-600)}
.btn-cancel{
  padding:14px 24px;background:var(--c-bg-alt);color:var(--c-ink-2);border-radius:12px;
  font-weight:700;font-size:14px;
}

/* Toast */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--c-ok);color:#fff;padding:12px 20px;border-radius:99px;
  font-size:13px;font-weight:700;box-shadow:0 10px 28px rgba(22,163,74,.4);
  z-index:9999;transition:transform .3s;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (min-width:900px){
  body{padding:30px 0}
  .app-shell{margin:0 auto;border-radius:24px;min-height:calc(100vh - 60px);overflow:hidden}
}
</style>
<link rel="stylesheet" href="app-polish.css" />
</head>
<body>

<div class="app-shell">

  <header class="page-header">
    <button onclick="history.back()" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1>Edit Profil</h1>
  </header>

  <!-- Avatar -->
  <div class="avatar-edit">
    <div class="avatar-wrap">
      <div class="avatar-big" id="avatarBig">RN</div>
      <button class="avatar-cam" onclick="document.getElementById('avatarInput').click()" aria-label="Ganti foto">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input id="avatarInput" type="file" accept="image/*" hidden />
    </div>
    <p><strong>Ganti Foto Profil</strong> (JPG/PNG, max 5MB)</p>
  </div>

  <!-- Form -->
  <form class="form-section" id="profileForm" onsubmit="saveProfile(event)">

    <div class="section-divider" style="padding-top:0">Informasi Pribadi</div>

    <div class="form-group">
      <label for="fullName">Nama Lengkap</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <input id="fullName" type="text" value="Raynoe" required />
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="email" type="email" value="raynoe@gmail.com" required />
      </div>
      <span class="hint">Email digunakan untuk login & notifikasi penting</span>
    </div>

    <div class="form-group">
      <label for="phone">Nomor HP / WhatsApp</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <input id="phone" type="tel" value="+62 812-3456-7890" />
      </div>
      <span class="hint">Untuk notifikasi booking via WhatsApp</span>
    </div>

    <div class="form-group">
      <label for="birthdate">Tanggal Lahir</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        <input id="birthdate" type="date" value="1995-03-15" />
      </div>
      <span class="hint">Dapat hadiah spesial di hari ulang tahun 🎂</span>
    </div>

    <div class="form-group">
      <label for="gender">Jenis Kelamin</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
        <select id="gender">
          <option value="">Pilih jenis kelamin</option>
          <option value="L">Laki-laki</option>
          <option value="P" selected>Perempuan</option>
          <option value="O">Lainnya</option>
          <option value="N">Tidak ingin diisi</option>
        </select>
      </div>
    </div>

    <div class="section-divider">Alamat & Preferensi</div>

    <div class="form-group">
      <label for="address">Alamat Default</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <input id="address" type="text" value="Jl. Tebet Raya No. 12, Jakarta Selatan" />
      </div>
    </div>

    <div class="form-group">
      <label for="notifPref">Notifikasi Promo</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <select id="notifPref">
          <option value="all" selected>Semua promo & voucher</option>
          <option value="favorite">Hanya bisnis favorit</option>
          <option value="off">Matikan promo</option>
        </select>
      </div>
    </div>

    <div style="height:80px"></div>
  </form>

  <div class="actions-bottom">
    <button type="button" class="btn-cancel" onclick="history.back()">Batal</button>
    <button type="submit" class="btn-save" form="profileForm">Simpan Perubahan</button>
  </div>

</div>

<div class="toast" id="toast">✓ Profil berhasil diperbarui</div>

<script>
// Load user data from localStorage if available
(function loadProfile(){
  const user = JSON.parse(localStorage.getItem('pesanaja-user') || '{}');
  if (user.name) document.getElementById('fullName').value = user.name;
  if (user.email) document.getElementById('email').value = user.email;
  if (user.phone) document.getElementById('phone').value = user.phone;
  if (user.birthdate) document.getElementById('birthdate').value = user.birthdate;
  if (user.gender) document.getElementById('gender').value = user.gender;
  if (user.address) document.getElementById('address').value = user.address;
  if (user.notifPref) document.getElementById('notifPref').value = user.notifPref;

  // Update avatar initials
  const initials = (user.name || 'RN').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('avatarBig').textContent = initials || 'RN';
})();

// Preview uploaded image
document.getElementById('avatarInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const av = document.getElementById('avatarBig');
    av.style.background = `url(${ev.target.result}) center/cover no-repeat`;
    av.textContent = '';
  };
  reader.readAsDataURL(file);
});

function saveProfile(e){
  e.preventDefault();
  const existing = JSON.parse(localStorage.getItem('pesanaja-user') || '{}');
  const user = {
    ...existing,
    name: document.getElementById('fullName').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    birthdate: document.getElementById('birthdate').value,
    gender: document.getElementById('gender').value,
    address: document.getElementById('address').value,
    notifPref: document.getElementById('notifPref').value,
    updatedAt: new Date().toISOString()
  };
  localStorage.setItem('pesanaja-user', JSON.stringify(user));

  // Show toast
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => location.href = 'profile.html', 300);
  }, 1400);
}
</script>

<script src="app-polish.js"></script>
</body>
</html>
