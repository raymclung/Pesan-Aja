<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1F4FD9" />
<title>PesanAja — Pesanan Saya</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:var(--font);color:var(--c-ink);background:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:88px;box-shadow:0 0 60px rgba(11,23,38,.08)}
@media (min-width:520px){
  body{background:#EEF2F7;background-image:linear-gradient(rgba(31,79,217,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(31,79,217,.04) 1px,transparent 1px);background-size:24px 24px}
}

.subheader{
  display:flex;align-items:center;gap:10px;padding:14px 20px;background:#fff;
  border-bottom:1px solid var(--c-line-2);
}
.subheader h3{margin:0;font-size:18px;font-weight:800;flex:1}

/* Order tabs */
.orders-tabs{
  display:flex;padding:0 20px;gap:6px;background:#fff;
  border-bottom:1px solid var(--c-line-2);position:sticky;top:0;z-index:10;
  overflow-x:auto;scrollbar-width:none;
}
.orders-tabs::-webkit-scrollbar{display:none}
.orders-tabs button{
  padding:14px 16px;font-size:13px;font-weight:700;color:var(--c-muted);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:color .15s ease,border-color .15s ease;
}
.orders-tabs button.active{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.orders-tabs .count{
  display:inline-block;background:var(--c-bg-alt);
  font-size:10.5px;font-weight:800;padding:1px 7px;
  border-radius:99px;margin-left:5px;
}
.orders-tabs button.active .count{background:var(--c-bg-soft);color:var(--c-primary)}

/* Order list */
.order-list{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.order-card{
  background:#fff;border-radius:14px;padding:14px;
  border:1px solid var(--c-line-2);box-shadow:var(--shadow-sm);
  transition:transform .15s ease;
}
.order-card:active{transform:translateY(-2px)}
.order-card .head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;padding-bottom:10px;
  border-bottom:1px dashed var(--c-line);
}
.order-card .cat-mini{
  display:flex;align-items:center;gap:6px;font-size:11px;
  color:var(--c-muted);font-weight:600;
}
.order-card .cat-mini .ic{
  width:24px;height:24px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;font-size:14px;background:#FFE9DA;
}
.status-pill{
  font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;
  letter-spacing:.04em;
}
.status-pill.upcoming{background:#DBEAFE;color:#1D4ED8}
.status-pill.ongoing{background:#FFE9DA;color:var(--c-accent-600)}
.status-pill.done{background:#DCFCE7;color:#15803D}
.status-pill.cancel{background:#FEE2E2;color:#B91C1C}
.order-card h4{margin:0 0 4px;font-size:14.5px;font-weight:700}
.order-card .when{
  font-size:12px;color:var(--c-muted);margin-bottom:6px;
  display:flex;align-items:center;gap:5px;
}
.order-card .when svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.order-card .svc{font-size:12.5px;color:var(--c-ink-2);margin-bottom:8px}
.order-card .price{
  font-size:14px;font-weight:800;color:var(--c-primary);margin-bottom:10px;
}
.order-card .actions{display:flex;gap:8px;margin-top:10px}
.order-card .actions button{
  flex:1;padding:10px 0;border-radius:10px;
  font-size:12.5px;font-weight:700;
  border:1.5px solid var(--c-line);
  cursor:pointer;transition:all .15s ease;
}
.order-card .actions button:active{transform:scale(.97)}
.order-card .actions .primary{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.order-card .actions .danger{color:var(--c-danger);border-color:#FFE0E0}
.order-card .actions .wa-action{color:#16A34A;border-color:#86EFAC;background:#F0FDF4}
.order-card .actions .wa-action:hover{background:#DCFCE7}
.order-card .actions .wa-primary{background:#25D366;border-color:#25D366}
.order-card .actions .wa-primary:hover{background:#1FAE54}
.order-card .actions .btn-link{flex:1;display:flex;text-decoration:none}
.order-card .actions .btn-link button{width:100%;font-family:inherit}

/* Empty state */
.empty{
  text-align:center;padding:70px 30px;color:var(--c-muted);
}
.empty .ic{font-size:60px;margin-bottom:16px}
.empty h4{font-size:16px;color:var(--c-ink);margin:0 0 8px}
.empty p{font-size:13px;margin:0 0 20px}
.empty a{
  display:inline-block;background:var(--c-primary);color:#fff;
  padding:11px 22px;border-radius:99px;
  font-size:13px;font-weight:700;
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:#fff;border-top:1px solid var(--c-line);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:50;
}
.bottom-nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--c-muted-2);
  flex:1;padding:6px 4px;position:relative;
}
.bottom-nav button.active{color:var(--c-primary)}
.bottom-nav button.active::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:28px;height:3px;background:var(--c-primary);border-radius:0 0 3px 3px;
}
.bottom-nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav button.active svg{stroke-width:2.4}
</style>
<link rel="stylesheet" href="app-polish.css" />
</head>
<body>

<div class="app">

  <div class="subheader">
    <h3>Pesanan Saya</h3>
  </div>

  <div class="orders-tabs" id="ordersTabs">
    <button class="active" data-tab="upcoming">Akan Datang <span class="count" id="countUpcoming">0</span></button>
    <button data-tab="ongoing">Berlangsung <span class="count" id="countOngoing">0</span></button>
    <button data-tab="done">Selesai <span class="count" id="countDone">0</span></button>
    <button data-tab="cancel">Dibatalkan <span class="count" id="countCancel">0</span></button>
  </div>

  <div class="order-list" id="orderList"></div>

</div>

<nav class="bottom-nav">
  <a href="index.html" style="display:contents"><button aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </button></a>
  <button class="active" aria-label="Order">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
    Order
  </button>
  <a href="promo.html" style="display:contents"><button aria-label="Promo">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8V5a2 2 0 0 1 4 0v3M12 8V5a2 2 0 0 0-4 0v3"/></svg>
    Promo
  </button></a>
  <a href="inbox.html" style="display:contents"><button aria-label="Chat">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z"/></svg>
    Chat
  </button></a>
  <a href="profile.html" style="display:contents"><button aria-label="Profil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    Profil
  </button></a>
</nav>

<script>
  /* Sample orders + add user's real booking if exists */
  const sampleOrders = [
    { id:'#PSA-241102-K7M3', biz:'Salon Melati', services:[{name:'Creambath Premium',price:120000,dur:60}], date:'Sen, 18 Mei 2026', time:'15:30', staff:'Linda Dewi', total:'Rp 120.000', status:'upcoming', cat:'💇' },
    { id:'#PSA-241028-X2L9', biz:'Laundry Sebening', services:[{name:'Cuci Kering 5kg',price:75000}], date:'Sel, 19 Mei 2026', time:'10:00', staff:'-', total:'Rp 75.000', status:'upcoming', cat:'👕' },
    { id:'#PSA-241025-A1Z8', biz:'Asana Bali Spa', services:[{name:'Spa 90 menit',price:175000}], date:'Sab, 17 Mei 2026', time:'14:00', staff:'Sari Rahayu', total:'Rp 175.000', status:'ongoing', cat:'💆' },
    { id:'#PSA-241015-P9Q4', biz:'Barbershop Klasik', services:[{name:'Potong Pria',price:48000}], date:'Min, 12 Mei 2026', time:'11:00', staff:'Eko Saputra', total:'Rp 48.000', status:'done', cat:'✂️' },
    { id:'#PSA-241020-S4R7', biz:'SportAja Arena', services:[{name:'Futsal Arena — Lapangan 1 · 1 jam',price:180000,dur:60}], date:'Kam, 15 Mei 2026', time:'19:00', staff:'Lapangan 1', total:'Rp 180.000', status:'done', cat:'⚽', verticalKey:'sport' },
    { id:'#PSA-241008-N5W2', biz:'Salon Melati', services:[{name:'Manicure',price:100000}], date:'Sab, 5 Mei 2026', time:'13:00', staff:'Sari Rahayu', total:'Rp 100.000', status:'done', cat:'💇' },
    { id:'#PSA-241003-Z3C7', biz:'FitZone Jakarta', services:[{name:'Trial 1 minggu',price:0}], date:'Jum, 28 Apr 2026', time:'07:00', staff:'-', total:'Rp 0', status:'cancel', cat:'🏋️' }
  ];

  /* Merge sample history with the user's real bookings, and persist the
     samples once so order-detail.html can open any card by id during the demo. */
  const userOrders = JSON.parse(localStorage.getItem('pesanaja-orders') || '[]');
  const seenIds = new Set(userOrders.map(o => o.id));
  sampleOrders.forEach(o => { if (!seenIds.has(o.id)) userOrders.push(o); });
  // Add cat emoji based on biz name
  userOrders.forEach(o => {
    if (!o.cat) {
      if (/salon/i.test(o.biz)) o.cat = '💇';
      else if (/laundry/i.test(o.biz)) o.cat = '👕';
      else if (/spa/i.test(o.biz)) o.cat = '💆';
      else if (/barber/i.test(o.biz)) o.cat = '✂️';
      else if (/sport|arena|futsal|badminton|padel/i.test(o.biz)) o.cat = '⚽';
      else if (/wash|auto|cuci/i.test(o.biz)) o.cat = '🚗';
      else if (/clean/i.test(o.biz)) o.cat = '🧹';
      else if (/gym|fitness|fitzone/i.test(o.biz)) o.cat = '🏋️';
      else o.cat = '📋';
    }
  });
  localStorage.setItem('pesanaja-orders', JSON.stringify(userOrders));
  const allOrders = userOrders;

  /* Count by status */
  const counts = { upcoming:0, ongoing:0, done:0, cancel:0 };
  allOrders.forEach(o => counts[o.status]++);
  Object.keys(counts).forEach(k => {
    const el = document.getElementById('count' + k.charAt(0).toUpperCase() + k.slice(1));
    if (el) el.textContent = counts[k];
  });

  /* Render orders */
  let currentTab = 'upcoming';
  function render() {
    const list = document.getElementById('orderList');
    const filtered = allOrders.filter(o => o.status === currentTab);
    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="ic">📭</div>
          <h4>Belum ada pesanan ${labelOf(currentTab).toLowerCase()}</h4>
          <p>Mulai pesan layanan favoritmu sekarang.</p>
          <a href="index.html">Cari Layanan</a>
        </div>
      `;
      return;
    }
    list.innerHTML = filtered.map(o => `
      <div class="order-card">
        <div class="head">
          <div class="cat-mini">
            <div class="ic">${o.cat}</div>
            <span>${o.biz}</span>
          </div>
          <span class="status-pill ${o.status}">${labelOf(o.status)}</span>
        </div>
        <h4>${o.services.map(s => s.name).join(' + ')}</h4>
        <div class="when">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          ${o.date} · ${o.time}${o.staff && o.staff !== '-' ? ' · '+o.staff : ''}
        </div>
        <div class="price">${o.total}</div>
        ${actionsFor(o)}
      </div>
    `).join('');
  }

  function labelOf(s){return {upcoming:'Akan Datang',ongoing:'Berlangsung',done:'Selesai',cancel:'Dibatalkan'}[s]||s}

  function waLinkFor(o){
    const msg = `Halo PesanAja, saya mau menghubungi *${o.biz}* terkait booking saya:\n\n`+
      `🧾 ID Booking: ${o.id}\n`+
      `💼 Layanan: ${o.services.map(s=>s.name).join(', ')}\n`+
      `📅 Jadwal: ${o.date} pukul ${o.time}\n`+
      (o.staff && o.staff !== '-' ? `👤 Staff: ${o.staff}\n` : '')+
      `💰 Total: ${o.total}\n\n`+
      `Pesan saya:\n`;
    return `https://wa.me/6289523809060?text=${encodeURIComponent(msg)}`;
  }

  function actionsFor(o){
    const wa = waLinkFor(o);
    if (o.status === 'upcoming') {
      return `<div class="actions">
        <button class="danger" onclick="cancelOrder('${o.id}')">Batalkan</button>
        <a href="${wa}" target="_blank" rel="noopener" class="btn-link"><button class="wa-action">💬 Hubungi</button></a>
        <button class="primary" onclick="location.href='order-detail.html?id=${encodeURIComponent(o.id)}'">Lihat Detail</button>
      </div>`;
    }
    if (o.status === 'ongoing') {
      return `<div class="actions">
        <a href="${wa}" target="_blank" rel="noopener" class="btn-link" style="flex:1"><button class="primary wa-primary" style="width:100%">💬 Hubungi via WhatsApp</button></a>
      </div>`;
    }
    if (o.status === 'done') {
      const reviewParams = `oid=${encodeURIComponent(o.id)}&biz=${encodeURIComponent(o.biz)}&svc=${encodeURIComponent(o.services.map(s=>s.name).join(', '))}&cat=${encodeURIComponent(o.cat||'📋')}`;
      return `<div class="actions">
        <a href="review.html?${reviewParams}" class="btn-link"><button>⭐ Beri Rating</button></a>
        <button class="primary" onclick="location.href='order-detail.html?id=${encodeURIComponent(o.id)}'">Lihat Detail</button>
      </div>`;
    }
    return '';
  }

  /* Cancel a booking — moves it to the "Dibatalkan" tab live (demo) */
  function cancelOrder(id){
    if (!confirm('Yakin ingin batalkan booking ini?')) return;
    const o = allOrders.find(x => x.id === id);
    if (o) o.status = 'cancel';
    localStorage.setItem('pesanaja-orders', JSON.stringify(allOrders));
    counts.upcoming = counts.ongoing = counts.done = counts.cancel = 0;
    allOrders.forEach(x => counts[x.status]++);
    Object.keys(counts).forEach(k => {
      const el = document.getElementById('count' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el) el.textContent = counts[k];
    });
    render();
  }

  /* Tab switching */
  document.querySelectorAll('.orders-tabs button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.orders-tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentTab = b.dataset.tab;
      render();
    });
  });

  render();
</script>
<script src="app-polish.js"></script>
</body>
</html>
