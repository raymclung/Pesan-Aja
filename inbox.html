<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1F4FD9" />
<title>PesanAja — Chat</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:var(--font);color:var(--c-ink);background:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:88px;box-shadow:0 0 60px rgba(11,23,38,.08)}
@media (min-width:520px){
  body{background:#EEF2F7;background-image:linear-gradient(rgba(31,79,217,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(31,79,217,.04) 1px,transparent 1px);background-size:24px 24px}
}
.subheader{
  display:flex;align-items:center;gap:10px;padding:14px 20px;background:#fff;
  border-bottom:1px solid var(--c-line-2);position:sticky;top:0;z-index:20;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;background:var(--c-bg-alt);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.back-btn svg{width:18px;height:18px;stroke:var(--c-ink);fill:none;stroke-width:2.4}
.subheader h3{margin:0;font-size:18px;font-weight:800;flex:1}
.subheader .search-ic{
  width:38px;height:38px;border-radius:50%;background:var(--c-bg-alt);
  display:flex;align-items:center;justify-content:center;
}
.subheader .search-ic svg{width:18px;height:18px;stroke:var(--c-ink);fill:none;stroke-width:2}

/* Inbox list */
.inbox-list{display:flex;flex-direction:column}
.chat-item{
  display:flex;gap:12px;padding:14px 20px;
  border-bottom:1px solid var(--c-line-2);
  cursor:pointer;transition:background .15s ease;
}
.chat-item:active{background:var(--c-bg-alt)}
.chat-avatar{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;position:relative;
  overflow:hidden;
}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-avatar .online{
  position:absolute;bottom:2px;right:2px;
  width:13px;height:13px;border-radius:50%;
  background:var(--c-ok);border:2.5px solid #fff;
}
.chat-body{flex:1;min-width:0}
.chat-top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px;
}
.chat-top .name{font-size:14px;font-weight:700;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top .time{font-size:11px;color:var(--c-muted);flex-shrink:0}
.chat-top .time.unread{color:var(--c-primary);font-weight:700}
.chat-bottom{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.chat-preview{
  font-size:12.5px;color:var(--c-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.chat-preview.unread{color:var(--c-ink-2);font-weight:600}
.unread-count{
  background:var(--c-primary);color:#fff;
  font-size:10.5px;font-weight:800;
  padding:2px 8px;border-radius:99px;flex-shrink:0;
  min-width:20px;text-align:center;
}

/* Filter tabs */
.chat-tabs{
  display:flex;padding:12px 20px;gap:8px;background:#fff;
  border-bottom:1px solid var(--c-line-2);overflow-x:auto;scrollbar-width:none;
}
.chat-tabs::-webkit-scrollbar{display:none}
.chat-tab{
  padding:7px 14px;font-size:12px;font-weight:700;color:var(--c-muted);
  background:var(--c-bg-alt);border-radius:99px;white-space:nowrap;cursor:pointer;
  transition:all .15s ease;
}
.chat-tab.active{background:var(--c-primary);color:#fff}

/* CHAT DETAIL OVERLAY */
.chat-detail{
  position:fixed;inset:0;background:#fff;z-index:100;
  display:none;flex-direction:column;
  max-width:480px;margin:0 auto;
}
.chat-detail.open{display:flex;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.cd-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  background:#fff;border-bottom:1px solid var(--c-line-2);
  position:sticky;top:0;z-index:5;
}
.cd-header .back-btn{margin-right:4px}
.cd-bizinfo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.cd-bizinfo .avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;overflow:hidden;
}
.cd-bizinfo .avatar img{width:100%;height:100%;object-fit:cover}
.cd-bizinfo .meta strong{display:block;font-size:14px;font-weight:700;color:var(--c-ink)}
.cd-bizinfo .meta .status{font-size:11px;color:var(--c-ok);font-weight:600}
.cd-header .act{
  width:38px;height:38px;border-radius:50%;background:var(--c-bg-alt);
  display:flex;align-items:center;justify-content:center;
}
.cd-header .act svg{width:18px;height:18px;stroke:var(--c-ink-2);fill:none;stroke-width:2}

.cd-msgs{
  flex:1;overflow-y:auto;padding:16px 14px;
  background:linear-gradient(180deg,#F6F9FF 0%,#FFFFFF 100%);
  display:flex;flex-direction:column;gap:8px;
}
.msg-day{
  align-self:center;background:var(--c-bg-alt);
  font-size:10.5px;font-weight:700;color:var(--c-muted);
  padding:4px 12px;border-radius:99px;margin:8px 0;letter-spacing:.04em;
}
.msg{
  max-width:75%;padding:9px 13px;border-radius:14px;
  font-size:13.5px;line-height:1.4;position:relative;
  box-shadow:0 1px 3px rgba(11,23,38,.05);
}
.msg.them{
  align-self:flex-start;background:#fff;
  border-bottom-left-radius:4px;color:var(--c-ink-2);
}
.msg.me{
  align-self:flex-end;background:var(--c-primary);color:#fff;
  border-bottom-right-radius:4px;
}
.msg .time{
  display:block;font-size:9.5px;margin-top:3px;opacity:.7;
}
.msg.me .time{color:rgba(255,255,255,.85);text-align:right}
.msg-system{
  align-self:center;background:rgba(255,122,45,.12);
  color:var(--c-accent-600);
  font-size:11.5px;font-weight:600;
  padding:6px 12px;border-radius:8px;text-align:center;max-width:80%;
}

/* Composer */
.cd-input{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:1px solid var(--c-line-2);
}
.cd-input .attach{
  width:36px;height:36px;border-radius:50%;background:var(--c-bg-alt);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cd-input .attach svg{width:18px;height:18px;stroke:var(--c-ink-2);fill:none;stroke-width:2}
.cd-input input{
  flex:1;border:1.5px solid var(--c-line);border-radius:99px;
  padding:9px 16px;font-family:inherit;font-size:13.5px;outline:none;
  background:var(--c-bg-alt);transition:border-color .15s,background .15s;
}
.cd-input input:focus{border-color:var(--c-primary);background:#fff}
.cd-send{
  width:38px;height:38px;border-radius:50%;
  background:var(--c-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cd-send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}

/* Empty state */
.empty{text-align:center;padding:70px 30px;color:var(--c-muted)}
.empty .ic{font-size:60px;margin-bottom:16px}
.empty h4{font-size:16px;color:var(--c-ink);margin:0 0 8px}
.empty p{font-size:13px;margin:0 0 20px}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:#fff;border-top:1px solid var(--c-line);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:50;
}
.bottom-nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--c-muted-2);
  flex:1;padding:6px 4px;position:relative;
}
.bottom-nav button.active{color:var(--c-primary)}
.bottom-nav button.active::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:28px;height:3px;background:var(--c-primary);border-radius:0 0 3px 3px;
}
.bottom-nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav button.active svg{stroke-width:2.4}
</style>
<link rel="stylesheet" href="app-polish.css" />
</head>
<body>

<div class="app">
  <div class="subheader">
    <a href="index.html"><button class="back-btn" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></a>
    <h3>Chat</h3>
    <button class="search-ic" aria-label="Cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>

  <div class="chat-tabs">
    <div class="chat-tab active">Semua</div>
    <div class="chat-tab">Belum Dibaca</div>
    <div class="chat-tab">Bisnis</div>
    <div class="chat-tab">PesanAja Support</div>
  </div>

  <div class="inbox-list" id="inboxList"></div>
</div>

<!-- Chat detail overlay -->
<div class="chat-detail" id="chatDetail">
  <div class="cd-header">
    <button class="back-btn" onclick="closeChat()" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="cd-bizinfo">
      <div class="avatar" id="cdAvatar"></div>
      <div class="meta">
        <strong id="cdName"></strong>
        <span class="status">● Online</span>
      </div>
    </div>
    <button class="act" aria-label="Telepon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>

  <div class="cd-msgs" id="cdMsgs"></div>

  <form class="cd-input" onsubmit="event.preventDefault();sendMsg();">
    <button type="button" class="attach" aria-label="Lampiran"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <input type="text" id="msgInput" placeholder="Ketik pesan..." />
    <button type="submit" class="cd-send" aria-label="Kirim"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </form>
</div>

<nav class="bottom-nav">
  <a href="index.html" style="display:contents"><button aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg>Home
  </button></a>
  <a href="orders.html" style="display:contents"><button aria-label="Order">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Order
  </button></a>
  <a href="promo.html" style="display:contents"><button aria-label="Promo">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8V5a2 2 0 0 1 4 0v3M12 8V5a2 2 0 0 0-4 0v3"/></svg>Promo
  </button></a>
  <button class="active" aria-label="Chat">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z"/></svg>Chat
  </button>
  <a href="profile.html" style="display:contents"><button aria-label="Profil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil
  </button></a>
</nav>

<script>
const chats = [
  { id:'salon-melati', name:'Salon Melati', avatar:'assets/categories/salon.jpg', bg:'linear-gradient(135deg,#fda4af,#f43f5e)',
    last:'Booking Anda sudah dikonfirmasi 🎉', time:'Baru saja', unread:2, online:true,
    msgs:[
      {sys:'14 Mei 2026'},
      {from:'them', text:'Halo Ray! Terima kasih sudah booking di Salon Melati 🙏', time:'10:24'},
      {from:'them', text:'Booking Anda untuk Potong Rambut + Cuci sudah saya konfirmasi ya. Dengan stylist Linda Dewi, jam 14:30.', time:'10:24'},
      {from:'me', text:'Sip, terima kasih! 🙏', time:'10:30'},
      {from:'me', text:'Btw apakah saya bisa minta produk tanpa SLS? Rambut saya agak sensitif.', time:'10:30'},
      {from:'them', text:'Tentu kak, kami punya produk Wella Elements yang sulfate-free. Akan saya siapkan ya 😊', time:'10:32'},
      {sys:'Hari ini'},
      {from:'them', text:'Booking Anda sudah dikonfirmasi 🎉', time:'14:15'},
      {from:'them', text:'Sampai bertemu 30 menit lagi ya kak!', time:'14:15'}
    ]
  },
  { id:'laundry', name:'Laundry Sebening', avatar:'assets/categories/laundry.jpg', bg:'linear-gradient(135deg,#93c5fd,#3b82f6)',
    last:'Pickup driver lagi otw, estimasi 10 menit lagi.', time:'1 jam', unread:1, online:true,
    msgs:[
      {sys:'Hari ini'},
      {from:'them', text:'Halo kak, pickup laundry hari ini ya? Saya cek dulu lokasinya.', time:'13:10'},
      {from:'me', text:'Iya kak, di Jl. Cihampelas no. 145', time:'13:12'},
      {from:'them', text:'Oke, driver akan sampai sekitar pukul 14:30 ya', time:'13:15'},
      {from:'them', text:'Pickup driver lagi otw, estimasi 10 menit lagi.', time:'14:20'}
    ]
  },
  { id:'asana', name:'Asana Bali Spa', avatar:null, emoji:'💆', bg:'linear-gradient(135deg,#c4b5fd,#7c3aed)',
    last:'Saya 5 jadwal yang available di hari Sabtu...', time:'Kemarin', unread:0, online:false,
    msgs:[
      {sys:'Kemarin'},
      {from:'me', text:'Sis, ada paket spa couple gak?', time:'18:45'},
      {from:'them', text:'Ada kak! Paket couple massage 90 menit + aromaterapi Rp 380rb berdua. Kalau berdua mau saya bookingin?', time:'19:20'},
      {from:'them', text:'Saya 5 jadwal yang available di hari Sabtu, kakak prefer jam berapa?', time:'19:22'}
    ]
  },
  { id:'barber', name:'Barbershop Klasik', avatar:'assets/categories/barber.jpg', bg:'linear-gradient(135deg,#6ee7b7,#10b981)',
    last:'Terima kasih sudah datang kak! Jangan lupa rating ya 🙏', time:'3 hari', unread:0, online:false,
    msgs:[
      {sys:'12 Mei 2026'},
      {from:'them', text:'Selamat datang di Barbershop Klasik! Mau saya bookingin pak Eko?', time:'10:00'},
      {from:'me', text:'Iya pak, jam 11 ya', time:'10:02'},
      {from:'them', text:'Siap kak, sampai bertemu', time:'10:03'},
      {from:'them', text:'Terima kasih sudah datang kak! Jangan lupa rating ya 🙏', time:'12:30'}
    ]
  },
  { id:'sport', name:'SportAja Arena', avatar:'assets/categories/sport.jpg', emoji:'⚽', bg:'linear-gradient(135deg,#5eead4,#0d9488)',
    last:'Lapangan 1 sudah dibooking ya kak, sampai jumpa jam 19:00 ⚽', time:'2 jam', unread:1, online:true,
    msgs:[
      {sys:'Hari ini'},
      {from:'me', text:'Bang, lapangan futsal jam 7 malam masih kosong?', time:'16:30'},
      {from:'them', text:'Masih kak! Lapangan 1 (vinyl) available jam 19:00. Mau saya bookingin?', time:'16:35'},
      {from:'me', text:'Boleh, 1 jam aja', time:'16:36'},
      {from:'them', text:'Lapangan 1 sudah dibooking ya kak, sampai jumpa jam 19:00 ⚽', time:'16:38'}
    ]
  },
  { id:'support', name:'PesanAja Support', avatar:'assets/logo.jpg', bg:'linear-gradient(135deg,#3A78E0,#1F4FD9)',
    last:'Halo Ray, ada yang bisa kami bantu?', time:'Kemarin', unread:0, online:true, badge:'OFFICIAL',
    msgs:[
      {sys:'Kemarin'},
      {from:'them', text:'Halo Ray, selamat datang di PesanAja! 👋', time:'09:00'},
      {from:'them', text:'Saya Mira dari tim support. Ada yang bisa kami bantu?', time:'09:00'},
      {from:'them', text:'Halo Ray, ada yang bisa kami bantu?', time:'15:30'}
    ]
  },
  { id:'fitzone', name:'FitZone Jakarta', avatar:null, emoji:'🏋️', bg:'linear-gradient(135deg,#fcd34d,#f59e0b)',
    last:'Promo trial 7 hari masih berlaku sampai akhir bulan', time:'5 hari', unread:0, online:false,
    msgs:[
      {sys:'10 Mei 2026'},
      {from:'them', text:'Halo kak, terima kasih sudah subscribe. Trial 7 hari sudah aktif ya', time:'10:00'},
      {from:'them', text:'Promo trial 7 hari masih berlaku sampai akhir bulan', time:'14:00'}
    ]
  }
];

function render(){
  const list = document.getElementById('inboxList');
  list.innerHTML = chats.map(c => `
    <div class="chat-item" onclick="openChat('${c.id}')">
      <div class="chat-avatar" style="background:${c.bg}">
        ${c.avatar ? `<img src="${c.avatar}" alt="" onerror="this.outerHTML='${c.emoji || '🏢'}'" />` : (c.emoji || '🏢')}
        ${c.online ? '<span class="online"></span>' : ''}
      </div>
      <div class="chat-body">
        <div class="chat-top">
          <span class="name">${c.name}</span>
          <span class="time ${c.unread > 0 ? 'unread' : ''}">${c.time}</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-preview ${c.unread > 0 ? 'unread' : ''}">${c.last}</span>
          ${c.unread > 0 ? `<span class="unread-count">${c.unread}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

let currentChat = null;
function openChat(id){
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  currentChat = chat;
  document.getElementById('cdName').textContent = chat.name;
  const av = document.getElementById('cdAvatar');
  av.style.background = chat.bg;
  av.innerHTML = chat.avatar ? `<img src="${chat.avatar}" alt="" onerror="this.outerHTML='${chat.emoji || '🏢'}'" />` : (chat.emoji || '🏢');
  const msgs = document.getElementById('cdMsgs');
  msgs.innerHTML = chat.msgs.map(m => {
    if (m.sys) return `<div class="msg-day">${m.sys}</div>`;
    return `<div class="msg ${m.from}">${m.text}<span class="time">${m.time}</span></div>`;
  }).join('');
  // Mark as read
  chat.unread = 0;
  render();
  document.getElementById('chatDetail').classList.add('open');
  setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function closeChat(){
  document.getElementById('chatDetail').classList.remove('open');
  currentChat = null;
}

function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChat) return;
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  currentChat.msgs.push({from:'me',text,time});
  currentChat.last = text;
  currentChat.time = 'Baru saja';
  input.value = '';
  const msgs = document.getElementById('cdMsgs');
  msgs.insertAdjacentHTML('beforeend', `<div class="msg me">${text}<span class="time">${time}</span></div>`);
  msgs.scrollTop = msgs.scrollHeight;
  // Simulate reply after 2 seconds
  setTimeout(() => {
    if (!currentChat) return;
    const reply = 'Baik kak, saya cek dulu ya 🙏';
    currentChat.msgs.push({from:'them',text:reply,time});
    msgs.insertAdjacentHTML('beforeend', `<div class="msg them">${reply}<span class="time">${time}</span></div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }, 1800);
}

document.querySelectorAll('.chat-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.chat-tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
}));

render();
</script>
<script src="app-polish.js"></script>
</body>
